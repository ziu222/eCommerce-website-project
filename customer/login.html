<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - EC SHOP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../asset/css/ui.css">
    <link rel="stylesheet" href="../asset/css/user-login.css">
</head>

<body class="auth-page">
    <main class="auth">
        <aside class="auth-aside" aria-hidden="true">
            <a class="brand" href="home.html" tabindex="-1"><span class="brand-mark">EC</span>EC SHOP</a>
            <p class="auth-aside-line">Electronics worth keeping.</p>
        </aside>

        <section class="auth-panel">
            <a class="brand auth-brand" href="home.html"><span class="brand-mark" aria-hidden="true">EC</span>EC SHOP</a>
            <h1>Welcome back</h1>
            <p class="muted">Sign in to check out, track orders and use your wallet.</p>

            <form id="loginForm" class="auth-form" novalidate>
                <div class="field">
                    <label for="loginUser">Username</label>
                    <input class="input" type="text" id="loginUser" autocomplete="username" autofocus>
                </div>
                <div class="field">
                    <label for="loginPass">Password</label>
                    <div class="pass-wrap">
                        <input class="input" type="password" id="loginPass" autocomplete="current-password">
                        <button type="button" class="pass-toggle" aria-label="Show password" aria-pressed="false"><span class="ms">visibility</span></button>
                    </div>
                </div>
                <p class="auth-error" id="authError" role="alert" hidden></p>
                <button type="submit" class="btn btn-primary btn-lg btn-block" id="authSubmit">Sign in</button>
            </form>

            <p class="auth-switch">New here? <a href="signup.html">Create an account</a></p>
        </section>
    </main>

    <script src="../asset/js/api/client.js"></script>
    <script src="../asset/js/api/auth.js"></script>
    <script src="../asset/js/user/ui.js"></script>
    <script src="../asset/js/user/user-login.js"></script>
</body>

</html>
