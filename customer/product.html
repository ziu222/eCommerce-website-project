<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - EC SHOP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../asset/css/ui.css">
    <link rel="stylesheet" href="../asset/css/product.css">
    <link rel="stylesheet" href="../asset/css/support-chat.css">
</head>

<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header id="site-header" data-active="product"></header>

    <main id="main" class="container">
        <div class="page-head">
            <h1 id="shop-title">Shop</h1>
            <p id="result-count" aria-live="polite"></p>
        </div>

        <div class="filters">
            <div class="filters-row">
                <div class="filter-search">
                    <span class="ms" aria-hidden="true">search</span>
                    <label class="visually-hidden" for="filter-search">Search products</label>
                    <input class="input" id="filter-search" type="search" placeholder="Search products" autocomplete="off">
                </div>
                <div class="filter-sort">
                    <label class="visually-hidden" for="filter-sort">Sort by</label>
                    <select id="filter-sort" class="select">
                        <option value="default">Featured</option>
                        <option value="price-asc">Price: low to high</option>
                        <option value="price-desc">Price: high to low</option>
                        <option value="rating">Top rated</option>
                        <option value="newest">Newest</option>
                    </select>
                </div>
            </div>
            <div class="chips" id="filter-cats" role="group" aria-label="Category">
                <button type="button" class="filter-btn active" data-cat="all" aria-pressed="true">All</button>
                <button type="button" class="filter-btn" data-cat="smartphone" aria-pressed="false">Smartphones</button>
                <button type="button" class="filter-btn" data-cat="laptops" aria-pressed="false">Laptops</button>
                <button type="button" class="filter-btn" data-cat="wearables" aria-pressed="false">Wearables</button>
                <button type="button" class="filter-btn" data-cat="audio" aria-pressed="false">Audio</button>
                <button type="button" class="filter-btn" data-cat="cameras" aria-pressed="false">Cameras</button>
                <button type="button" class="filter-btn" data-cat="gaming" aria-pressed="false">Gaming</button>
            </div>
        </div>

        <div class="pgrid" id="product-list" aria-live="polite" aria-busy="true"></div>
        <nav id="pagination" class="pagination" aria-label="Product pages"></nav>
    </main>

    <footer id="site-footer"></footer>

    <script src="../asset/js/api/client.js"></script>
    <script src="../asset/js/api/auth.js"></script>
    <script src="../asset/js/api/products.js"></script>
    <script src="../asset/js/user/ui.js"></script>
    <script src="../asset/js/user/addtocart.js"></script>
    <script src="../asset/js/user/shop-product.js"></script>
    <script src="../asset/js/user/user-login.js"></script>
    <script src="../asset/js/api/support.js"></script>
    <script src="../asset/js/user/support-chat.js"></script>
    <script src="../asset/js/user/support-threads.js"></script>
</body>

</html>
