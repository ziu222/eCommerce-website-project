<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account - EC SHOP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@400,0..1&icon_names=account_balance_wallet,account_circle,add_shopping_cart,arrow_downward,arrow_forward,arrow_upward,autorenew,calendar_month,cancel,check,check_circle,chevron_left,chevron_right,close,cloud_off,delete,edit,error,expand_more,forum,headphones,info,inventory_2,laptop_mac,local_shipping,lock,logout,mail,menu,pause,person,photo_camera,play_arrow,qr_code_2,receipt_long,save,schedule,search,search_off,send,shield,shopping_bag,smart_toy,smartphone,sports_esports,support_agent,undo,verified,visibility,visibility_off,warning,watch,workspace_premium&display=block" rel="stylesheet">
    <link rel="stylesheet" href="../asset/css/ui.css">
    <link rel="stylesheet" href="../asset/css/user-login.css">
</head>

<body class="auth-page">
    <main class="auth">
        <aside class="auth-aside auth-aside--warm" aria-hidden="true">
            <a class="brand" href="home.html" tabindex="-1"><span class="brand-mark">EC</span>EC SHOP</a>
            <div class="art">
                <figure class="art-tile" style="--n:1;--x:3%;--y:3%;--w:34%;--r:5deg;--depth:24;--t:8s"><img src="../asset/img/home/logiMX.jpg" alt=""><figcaption>Logitech MX Master 3S</figcaption></figure>
                <figure class="art-tile" style="--n:2;--x:60%;--y:0%;--w:35%;--r:-5deg;--zoom:1.5;--depth:36;--t:7s"><img src="../asset/img/home/xBox.webp" alt=""><figcaption>Xbox Series X</figcaption></figure>
                <figure class="art-tile" style="--n:3;--x:30%;--y:31%;--w:40%;--r:-3deg;--depth:14;--t:9s"><img src="../asset/img/home/boseQuiet.jpg" alt=""><figcaption>Bose QuietComfort Ultra</figcaption></figure>
                <figure class="art-tile" style="--n:4;--x:68%;--y:52%;--w:29%;--r:6deg;--zoom:2;--depth:42;--t:8.5s"><img src="../asset/img/home/jblCharge.jpg" alt=""><figcaption>JBL Charge 5</figcaption></figure>
                <figure class="art-tile" style="--n:5;--x:2%;--y:55%;--w:27%;--r:-7deg;--zoom:2.3;--depth:30;--t:7.5s"><img src="../asset/img/home/kindle.jpeg" alt=""><figcaption>Kindle Paperwhite</figcaption></figure>
                <span class="art-chip" style="--n:6;--x:37%;--y:-7%;--depth:50"><span class="ms">shopping_bag</span>One cart</span>
                <span class="art-chip" style="--n:7;--x:1%;--y:42%;--depth:46"><span class="ms">verified</span>Many sellers</span>
                <span class="art-chip" style="--n:8;--x:33%;--y:90%;--depth:48"><span class="ms">support_agent</span>Real support</span>
            </div>
            <p class="auth-aside-line">One cart. Many sellers. Real support.</p>
        </aside>

        <section class="auth-panel">
            <a class="brand auth-brand" href="home.html"><span class="brand-mark" aria-hidden="true">EC</span>EC SHOP</a>
            <h1>Create your account</h1>
            <p class="muted">It takes a minute. You can add money to your wallet later.</p>

            <form id="signupForm" class="auth-form" novalidate>
                <div class="field">
                    <label for="suName">Full name</label>
                    <input class="input" type="text" id="suName" autocomplete="name" autofocus>
                </div>
                <div class="field">
                    <label for="suUser">Username</label>
                    <input class="input" type="text" id="suUser" autocomplete="username">
                </div>
                <div class="field">
                    <label for="suEmail">Email</label>
                    <input class="input" type="email" id="suEmail" autocomplete="email">
                </div>
                <div class="field">
                    <label for="suPass">Password</label>
                    <div class="pass-wrap">
                        <input class="input" type="password" id="suPass" autocomplete="new-password">
                        <button type="button" class="pass-toggle" aria-label="Show password" aria-pressed="false"><span class="ms">visibility</span></button>
                    </div>
                    <p class="hint">At least 6 characters.</p>
                </div>
                <p class="auth-error" id="authError" role="alert" hidden></p>
                <button type="submit" class="btn btn-primary btn-lg btn-block" id="authSubmit">Create account</button>
            </form>

            <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
        </section>
    </main>

    <script src="../asset/js/api/client.js"></script>
    <script src="../asset/js/api/auth.js"></script>
    <script src="../asset/js/user/ui.js"></script>
    <script src="../asset/js/user/auth-art.js"></script>
    <script src="../asset/js/user/user-signup.js"></script>
</body>

</html>
