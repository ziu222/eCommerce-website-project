<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - EC SHOP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@400,0..1&icon_names=account_balance_wallet,account_circle,add_shopping_cart,arrow_downward,arrow_forward,arrow_upward,autorenew,calendar_month,cancel,check,check_circle,chevron_left,chevron_right,close,cloud_off,delete,edit,error,expand_more,forum,headphones,info,inventory_2,laptop_mac,local_shipping,lock,logout,mail,menu,pause,person,photo_camera,play_arrow,qr_code_2,receipt_long,save,schedule,search,search_off,send,shield,shopping_bag,smart_toy,smartphone,sports_esports,support_agent,undo,verified,visibility,visibility_off,warning,watch,workspace_premium&display=block" rel="stylesheet">
    <link rel="stylesheet" href="../asset/css/ui.css">
    <link rel="stylesheet" href="../asset/css/wallet.css">
    <link rel="stylesheet" href="../asset/css/support-chat.css">
</head>

<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header id="site-header" data-active="wallet"></header>

    <main id="main" class="container">
        <div class="page-head">
            <h1>Wallet</h1>
            <p>Keep a balance here to check out in one tap.</p>
        </div>

        <div class="wallet-layout">
            <div class="wallet-main">
                <section class="balance" aria-label="Balance">
                    <p class="balance-label">Available balance</p>
                    <p class="balance-amount" id="walletBalance">$0.00</p>
                    <p class="balance-sub">EC SHOP Wallet</p>
                </section>

                <section class="card topup" id="depositCard" aria-labelledby="topupTitle">
                    <h2 id="topupTitle">Add money</h2>
                    <p class="demo-note"><span class="ms">info</span>Demo mode: no real money is charged.</p>

                    <div class="deposit-step active" id="step1">
                        <div class="presets" role="group" aria-label="Quick amounts">
                            <button type="button" class="preset-btn" data-amount="50">$50</button>
                            <button type="button" class="preset-btn" data-amount="100">$100</button>
                            <button type="button" class="preset-btn" data-amount="200">$200</button>
                            <button type="button" class="preset-btn" data-amount="500">$500</button>
                        </div>
                        <div class="field">
                            <label for="topupAmount">Or enter an amount (USD)</label>
                            <input type="number" class="input" id="topupAmount" placeholder="e.g. 75" min="1" inputmode="decimal">
                            <p class="error" id="topupError" role="alert" hidden>Enter an amount above $0.</p>
                        </div>
                        <button type="button" class="btn btn-primary btn-lg btn-block" id="btnNext">Continue</button>
                    </div>

                    <div class="deposit-step" id="step2">
                        <p class="step-sub">Adding <strong id="displayAmount">$0</strong>. Choose how to pay.</p>
                        <div class="gateways">
                            <button type="button" class="gateway-card" data-gw="momo" data-label="MoMo"><span class="ms">smartphone</span>MoMo</button>
                            <button type="button" class="gateway-card" data-gw="shopee" data-label="ShopeePay"><span class="ms">shopping_bag</span>ShopeePay</button>
                            <button type="button" class="gateway-card" data-gw="vnqr" data-label="VNQRPay"><span class="ms">qr_code_2</span>VNQRPay</button>
                        </div>
                        <button type="button" class="btn btn-ghost btn-block" id="back1">Back</button>
                    </div>

                    <div class="deposit-step" id="step3">
                        <dl class="confirm">
                            <div><dt>Method</dt><dd id="qrGwHeader">MoMo</dd></div>
                            <div class="total"><dt>Amount</dt><dd id="qrAmount">$0</dd></div>
                        </dl>
                        <button type="button" class="btn btn-primary btn-lg btn-block" id="btnConfirm"><span class="ms">check_circle</span>Confirm payment</button>
                        <button type="button" class="btn btn-ghost btn-block" id="btnCancelPay">Cancel</button>
                    </div>
                </section>
            </div>

            <section class="card history" aria-labelledby="historyTitle">
                <h2 id="historyTitle">Transaction history</h2>
                <div class="tx-list" id="txList" aria-live="polite">
                    <div class="empty"><span class="ms">receipt_long</span>No transactions yet</div>
                </div>
            </section>
        </div>
    </main>

    <footer id="site-footer"></footer>

    <script src="../asset/js/api/client.js"></script>
    <script src="../asset/js/api/auth.js"></script>
    <script src="../asset/js/api/commerce.js"></script>
    <script src="../asset/js/core/auth.js"></script>
    <script src="../asset/js/user/ui.js"></script>
    <script src="../asset/js/user/addtocart.js"></script>
    <script src="../asset/js/user/user-login.js"></script>
    <script src="../asset/js/user/wallet.js"></script>
    <script src="../asset/js/api/support.js"></script>
    <script src="../asset/js/user/support-chat.js"></script>
    <script src="../asset/js/user/support-threads.js"></script>
</body>

</html>
